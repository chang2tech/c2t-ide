# Build IDE Code — desktop packages (Linux AppImage + .deb, Windows installer)
#
# Strategy (VSCodium-style, adapted to this fork):
#   1. npm ci (root + build/) with the exact Node version from .nvmrc,
#      scripts ENABLED (Q5): install scripts build every native module
#      for the Electron target pinned in .npmrc, exactly like upstream
#      (build/azure-pipelines/linux/steps/product-build-linux-setup.yml:
#      preinstall first, then plain npm ci). build/npm/preinstall.ts is
#      run explicitly before the root install so the Electron headers
#      (incl. the repo's custom V8 header overlay) are in place before
#      any native module compiles. The root postinstall
#      (build/npm/postinstall.ts) then runs as part of npm ci and
#      installs the per-directory dependencies (extensions/*, remote/,
#      ...) — the packaging typecheck needs them (extension tsconfigs
#      resolve @types/node from their OWN node_modules via "typeRoots",
#      not from the root install). The explicit postinstall step below
#      is kept only as a no-fast-path safety net.
#   2. Compile our built-in extension extensions/ide-agent with its own tsc
#      (the build's hardcoded extension-compilation list does NOT include it;
#      packaging scans extensions/*/package.json via glob, so the compiled
#      out/ dir gets bundled automatically by the gulp packaging tasks)
#   3. Linux: `npm run gulp vscode-linux-x64` -> AppImage + .deb
#      Windows: `npm run gulp vscode-win32-x64` -> NSIS installer (.exe)
#
# Triggers: manual (workflow_dispatch) or pushing a v* tag.
#
# NOT needed: no secrets, no certs, no Apple/Windows signing for these
# artifacts (unsigned; Windows SmartScreen will warn — expected for a first alpha).

name: Build IDE Code

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  VSCODE_ARCH: x64
  NPM_ARCH: x64
  # ENGINE_REF: full commit SHA of chang2tech/ide-code (the OpenCode engine
  # source) that is staged and bundled into the installer as
  # resources/app/engine/ (engine-packaging-spec-v1.md §6, phuong an A: the
  # engine repo is public, so actions/checkout needs no extra secret).
  # PLACEHOLDER on purpose: the SHA may only be pinned once lane A has
  # landed the two engine prerequisites from spec §3 in the engine repo
  # (relative Solid preload in the root bunfig.toml; @effect/platform-node
  # moved into @opencode/core dependencies) — a SHA without them produces
  # an engine closure that does not boot. Never put a branch or tag here:
  # the pin must be a full 40-char commit SHA so builds are reproducible.
  ENGINE_REF: 'b2d9f88258fc6fded77674880588bac61101b0fe'

jobs:
  build-linux-x64:
    name: Linux x64 (AppImage + deb)
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout engine source (chang2tech/ide-code @ ENGINE_REF)
        uses: actions/checkout@v4
        with:
          repository: chang2tech/ide-code
          ref: ${{ env.ENGINE_REF }}
          path: .build/engine-src
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            build/package-lock.json
            extensions/ide-agent/package-lock.json

      # Cache node_modules khóa theo hash của TOÀN BỘ lockfile (root, build/,
      # remote/ và mọi extensions/*/package-lock.json): lockfile đổi ở bất kỳ
      # đâu là khóa cache đổi theo. Chỉ khi cache khớp CHÍNH XÁC (cache-hit
      # == 'true') mới bỏ qua 3 bước cài đặt bên dưới; khớp một phần qua
      # restore-keys thì các bước cài vẫn chạy bình thường (npm ci xóa sạch
      # rồi cài lại theo lockfile) nên cache không bao giờ làm sai
      # dependencies — tệ nhất là không tiết kiệm được thời gian.
      # .build/typings chứa electron.d.ts do postinstall tải về, bước biên
      # dịch src cần file này nên phải cache kèm.
      - name: Cache node_modules (theo lockfile)
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            build/node_modules
            build/rspack/node_modules
            build/vite/node_modules
            remote/node_modules
            remote/web/node_modules
            extensions/node_modules
            extensions/*/node_modules
            extensions/css-language-features/server/node_modules
            extensions/html-language-features/server/node_modules
            extensions/json-language-features/server/node_modules
            .build/typings
          # Prefix "nm-s1" (scripts-enabled generation 1, Q5): caches saved
          # by the old script-free policy contain no .node bindings
          # and the key does NOT hash this workflow file, so the prefix
          # bump is what forces a full script-ful install on the first
          # run after Q5 and keeps script-free caches out of this job.
          key: ide-code-nm-s1-${{ runner.os }}-${{ hashFiles('package-lock.json', 'build/package-lock.json', 'remote/package-lock.json', 'extensions/*/package-lock.json', 'extensions/package-lock.json', 'extensions/css-language-features/server/package-lock.json', 'extensions/html-language-features/server/package-lock.json', 'extensions/json-language-features/server/package-lock.json', 'remote/web/package-lock.json', 'build/rspack/package-lock.json', 'build/vite/package-lock.json', '.nvmrc', '.npmrc') }}
          restore-keys: |
            ide-code-nm-s1-${{ runner.os }}-

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        shell: bash
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libsecret-1-dev \
            libkrb5-dev \
            fakeroot \
            dpkg-dev \
            file \
            wget \
            libx11-dev \
            libxkbfile-dev

      - name: Install build/ dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        working-directory: build
        shell: bash
        run: |
          set -e
          # Scripts enabled (Q5): build/ native deps (keytar, tree-sitter)
          # build here against build/.npmrc (Node target), like upstream's
          # plain `npm ci` in build/ (product-build-linux-setup.yml).
          # keytar's source fallback needs libsecret-1-dev (apt step above);
          # it first tries a prebuild download.
          for i in 1 2 3 4 5; do npm ci && break || {
            [ "$i" -eq 5 ] && { echo "npm ci (build) failed 5 times" >&2; exit 1; }
            echo "npm ci (build) failed, retry $i/5"; sleep 10;
          }; done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run preinstall (Electron headers + pinned node-gyp)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          # Mirror upstream (product-build-linux-setup.yml: "Run preinstall
          # script before root dependencies are installed so that v8 headers
          # are patched correctly for native modules"). npm ci would run the
          # root preinstall itself, but not necessarily before dependency
          # install scripts compile native modules against those headers.
          node build/npm/preinstall.ts
        env:
          VSCODE_FORCE_INSTALL: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install root dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          # Scripts enabled (Q5): every native module builds for the
          # Electron target from .npmrc via its install script (or npm's
          # default node-gyp hook for binding.gyp packages), and the root
          # postinstall (build/npm/postinstall.ts) runs as part of this
          # install, fanning out to build/, remote/ and extensions/*.
          # The download-skip envs below mirror upstream's install step so
          # dependency scripts do not fetch browser/ML binaries mid-CI.
          for i in 1 2 3 4 5; do npm ci && break || {
            [ "$i" -eq 5 ] && { echo "npm ci (root) failed 5 times" >&2; exit 1; }
            echo "npm ci (root) failed, retry $i/5"; sleep 10;
          }; done
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}
          VSCODE_ARCH: ${{ env.VSCODE_ARCH }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          ONNXRUNTIME_NODE_INSTALL: skip
          FOUNDRY_LOCAL_SKIP_INSTALL: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install workspace dependencies (postinstall)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          # Safety net only (Q5): the root npm ci above already ran this
          # postinstall (build/npm/postinstall.ts), which installs
          # node_modules into build/, remote/ and every extensions/* dir
          # listed in build/npm/dirs.ts, and downloads
          # .build/typings/electron.d.ts (needed by the src compile;
          # without it the packaging typecheck (tsgo) fails with TS2688).
          # VSCODE_FORCE_INSTALL is intentionally NOT set here, so when
          # the ci-run postinstall completed, this re-run exits via its
          # own up-to-date fast path; it only does real work if the
          # ci-run postinstall did not finish. npm_command stays 'ci' so
          # any sub-install it does perform is deterministic and
          # script-ful, matching the root install policy.
          for i in 1 2 3; do node build/npm/postinstall.ts && break || {
            [ "$i" -eq 3 ] && { echo "postinstall failed 3 times" >&2; exit 1; }
            echo "postinstall failed, retry $i/3"; sleep 10;
          }; done
        env:
          npm_command: 'ci'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          ONNXRUNTIME_NODE_INSTALL: skip
          FOUNDRY_LOCAL_SKIP_INSTALL: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify native modules (built by install scripts)
        shell: bash
        run: |
          set -e
          # Assertion-only (Q5). Install scripts now build EVERY native
          # module (see the install steps above), so the hand-maintained
          # node-gyp rebuild list is gone. This step keeps the fail-fast
          # contract the rebuild step had: the 5 bindings the deb guard
          # (BUILD-QA A4-P1 in build/gulpfile.vscode.linux.ts) asserts in
          # staging must already exist here, minutes after install,
          # instead of failing ~45 minutes later in the deb build
          # (alpha.27 failure mode). It deliberately has NO cache-hit
          # guard: it must run on every run, including cache hits, so a
          # stale or script-free cache can never slip through silently.
          # -s (not -f): also reject zero-byte bindings.
          for f in \
            node_modules/@vscode/spdlog/build/Release/spdlog.node \
            node_modules/@vscode/sqlite3/build/Release/vscode-sqlite3.node \
            node_modules/@vscode/native-watchdog/build/Release/watchdog.node \
            node_modules/kerberos/build/Release/kerberos.node \
            node_modules/native-keymap/build/Release/keymapping.node ; do
            [ -s "$f" ] || { echo "missing native binding: $f" >&2; exit 1; }
          done

      - name: Run copilot extension postinstall
        shell: bash
        run: |
          set -e
          # extensions/copilot is the only built-in extension with an
          # install script: a pure-TS asset step (compresses tiktoken
          # tables, resolves/copies the @github/copilot SDK platform
          # files into place) that the script-free installs above skip.
          # Run it explicitly; it performs no native compilation.
          npm --prefix extensions/copilot run postinstall

      - name: Compile ide-agent extension
        shell: bash
        run: |
          set -e
          npm --prefix extensions/ide-agent ci
          npm --prefix extensions/ide-agent run compile
          test -f extensions/ide-agent/out/extension.js

      - name: Compile auxiliary ide-* extensions
        shell: bash
        run: |
          set -e
          # ide-checkout / ide-deeplink / ide-worktree-textmate are packaged
          # as built-in extensions (main: ./out/extension.js) but nothing
          # else compiles them, and out/ is gitignored -- without this step
          # CI would package them with no entry point (found in build #11
          # follow-up audit). Only ide-deeplink has a package-lock.json;
          # ide-checkout and ide-worktree-textmate have none, so use
          # npm install for all three.
          for ext in ide-checkout ide-deeplink ide-worktree-textmate; do
            npm --prefix "extensions/$ext" install --ignore-scripts --no-audit --no-fund
            npm --prefix "extensions/$ext" run compile
            test -f "extensions/$ext/out/extension.js"
          done



      - name: Stage engine (subset + bun 1.4.2)
        shell: bash
        run: |
          set -e
          bash build/engine/stage-engine.sh --src .build/engine-src --out .build/engine-staged --platform linux-x64 --engine-ref ${{ env.ENGINE_REF }}

      - name: Package Electron app (VSCode-linux-x64)
        shell: bash
        run: |
          set -e
          npm run gulp vscode-linux-x64
          # gulp packages to <repo>/../VSCode-linux-x64 (upstream layout:
          # build/gulpfile.vscode.ts packageTask), not .build/linux.
          test -x ../VSCode-linux-x64/ide-code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Build .deb package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          # PHẢI chạy riêng từng lệnh: gulp-cli chạy nhiều task cùng 1 lệnh ở chế độ
          # PARALLEL (mặc định; chỉ --series mới series) → build-deb spawn với cwd
          # chưa tồn tại (prepare-deb chưa kịp tạo) gây 'spawn /bin/sh ENOENT' (build #16).
          # Upstream (build/azure-pipelines/linux/steps/product-build-linux-package.yml)
          # cũng chạy 2 lệnh riêng biệt.
          npm run gulp vscode-linux-x64-prepare-deb
          npm run gulp vscode-linux-x64-build-deb
          ls -la .build/linux/deb/amd64/deb/*.deb
          # Verify the artifact itself (BUILD-QA B-W3-02): `ls` only proves a
          # file exists. Parse the .deb with dpkg-deb and require a non-empty
          # Depends plus the real payload inside the archive. `set -e` above
          # makes any failing check fail the whole step (red build).
          shopt -s nullglob
          DEB_FILES=(.build/linux/deb/amd64/deb/*.deb)
          DEB_COUNT=${#DEB_FILES[@]}
          [ "$DEB_COUNT" -eq 1 ] || { echo "::error::expected exactly 1 .deb, found $DEB_COUNT" >&2; exit 1; }
          DEB="${DEB_FILES[0]}"
          shopt -u nullglob
          echo "Verifying $DEB"
          dpkg-deb --info "$DEB"
          DEB_DEPENDS=$(dpkg-deb -f "$DEB" Depends) || { echo "::error::dpkg-deb -f failed on $DEB (corrupt archive or unreadable control section)" >&2; exit 1; }
          [ -n "$DEB_DEPENDS" ] || { echo "::error::$DEB has an empty Depends field" >&2; exit 1; }
          # List the contents to a file first, then grep the file. Piping
          # dpkg-deb straight into `grep -q` false-fails under this step's
          # `bash -eo pipefail`: grep exits on the first (early) match, the
          # closed pipe SIGPIPEs dpkg-deb's tar subprocess, and pipefail
          # surfaces dpkg-deb's exit 2 as a bogus "missing payload" error
          # (alpha.29 run 39718978197; BUILD-QA-B deb-verify investigation).
          DEB_CONTENTS=$(mktemp)
          dpkg-deb --contents "$DEB" > "$DEB_CONTENTS"
          grep -q 'usr/share/ide-code/ide-code$' "$DEB_CONTENTS" || { echo "::error::$DEB is missing usr/share/ide-code/ide-code" >&2; exit 1; }
          grep -q 'usr/share/ide-code/resources/app/' "$DEB_CONTENTS" || { echo "::error::$DEB is missing usr/share/ide-code/resources/app/" >&2; exit 1; }
          rm -f "$DEB_CONTENTS"
          echo "Verified: $DEB (Depends non-empty, payload present)"

      - name: Verify engine payload in .deb
        shell: bash
        run: |
          set -e
          DEB=$(ls .build/linux/deb/amd64/deb/*.deb)
          rm -rf .build/engine-verify
          mkdir -p .build/engine-verify
          dpkg-deb -x "$DEB" .build/engine-verify
          # The script expects the app root: the directory that contains
          # resources/app/engine/. Any failed assert fails the job.
          bash build/engine/verify-engine-payload.sh .build/engine-verify/usr/share/ide-code

      - name: Build AppImage
        env:
          ARCH: x86_64
          APPIMAGE_EXTRACT_AND_RUN: 1
        shell: bash
        run: |
          set -e
          APPDIR="$PWD/dist/appimage/IDECode.AppDir"
          mkdir -p "$APPDIR/usr"
          cp -a "$PWD/../VSCode-linux-x64/." "$APPDIR/usr/"

          cat > "$APPDIR/ide-code.desktop" <<'EOF'
          [Desktop Entry]
          Name=IDE Code
          Comment=Cursor-class AI IDE
          Exec=ide-code --no-sandbox %F
          Icon=ide-code
          Type=Application
          StartupNotify=true
          Categories=Development;IDE;
          MimeType=text/plain;
          EOF

          # Icon: rebranded icon if present, else fall back to the stock one
          if [ -f resources/linux/ide-code.png ]; then
            cp resources/linux/ide-code.png "$APPDIR/ide-code.png"
          else
            cp resources/linux/code.png "$APPDIR/ide-code.png"
          fi

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/ide-code" --no-sandbox "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          # C-P2-11: pin appimagetool theo tag co dinh + kiem SHA256.
          # Gia tri da xac minh tu release chinh thuc AppImage/appimagetool 1.9.1:
          # digest API chinh thuc + tai asset ve do lai sha256sum khop nhau (W5, 2026-10-21).
          APPIMAGETOOL_TAG="1.9.1"
          APPIMAGETOOL_SHA256="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
          wget -q "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_TAG}/appimagetool-x86_64.AppImage" -O /tmp/appimagetool
          echo "${APPIMAGETOOL_SHA256}  /tmp/appimagetool" | sha256sum -c -
          chmod +x /tmp/appimagetool
          VERSION="$(node -p "require('./package.json').version")"
          /tmp/appimagetool "$APPDIR" "dist/IDE-Code-${VERSION}-linux-x64.AppImage"
          ls -la dist/*.AppImage

      - name: Resolve package version
        id: ver
        shell: bash
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          [ -n "$VERSION" ] || { echo "failed to read version from package.json" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ide-code-linux-x64-deb-v${{ steps.ver.outputs.version }}
          path: .build/linux/deb/amd64/deb/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ide-code-linux-x64-appimage-v${{ steps.ver.outputs.version }}
          path: dist/*.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  build-windows-x64:
    name: Windows x64 (installer)
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      VSCODE_ARCH: x64
      NPM_ARCH: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enable git long paths (this checkout only)
        shell: bash
        run: git config core.longpaths true

      - name: Guard - fail on over-long paths (MAX_PATH)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $limit = 230
          $scanErrors = $null
          $longest = Get-ChildItem -LiteralPath (Get-Location).Path -Recurse -Force -ErrorAction Continue -ErrorVariable +scanErrors |
            ForEach-Object { $_.FullName } |
            Sort-Object { $_.Length } -Descending |
            Select-Object -First 1
          if ($scanErrors) { throw "path guard: workspace scan incomplete ($($scanErrors.Count) enumeration errors) - longest-path result is not trustworthy" }
          if (-not $longest) { throw "path guard: workspace is empty after checkout" }
          Write-Host "Longest checkout path: $($longest.Length) chars (limit $limit, MAX_PATH 260)"
          Write-Host $longest
          if ($longest.Length -gt $limit) { throw "Path too long: $($longest.Length) > $limit - shorten the test/fixture name or move it shallower" }

      # The engine checkout deliberately sits AFTER the MAX_PATH guard
      # above: the guard recurses the whole workspace, and the engine
      # tree's deep paths are not part of the IDE checkout it protects.
      # It is still before every build/compile step of this job.
      - name: Checkout engine source (chang2tech/ide-code @ ENGINE_REF)
        uses: actions/checkout@v4
        with:
          repository: chang2tech/ide-code
          ref: ${{ env.ENGINE_REF }}
          path: .build/engine-src
          fetch-depth: 1

      - name: Sanity check - Git Bash and Windows SDK
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $bash = Get-Command bash.exe -ErrorAction SilentlyContinue
          if (-not $bash) { throw "bash.exe (Git Bash) not found on PATH - windows-2022 image assumption broken" }
          Write-Host "Git Bash: $($bash.Source)"
          & $bash.Source -c 'echo "bash $BASH_VERSION"'
          if ($LASTEXITCODE -ne 0) { throw "bash.exe found but does not run" }
          $sdkBin = "C:\Program Files (x86)\Windows Kits\10\bin"
          if (-not (Test-Path $sdkBin)) { throw "Windows SDK bin dir not found: $sdkBin" }
          $signtool = Get-ChildItem $sdkBin -Directory | Where-Object { Test-Path (Join-Path $_.FullName "x64\signtool.exe") }
          if (-not $signtool) { throw "signtool.exe not found under any Windows SDK version in $sdkBin" }
          $makeappx = Get-ChildItem $sdkBin -Directory | Where-Object { Test-Path (Join-Path $_.FullName "x64\makeappx.exe") }
          if (-not $makeappx) { throw "makeappx.exe not found under any Windows SDK version in $sdkBin" }
          Write-Host "Windows SDK tools OK (signtool + makeappx present under $sdkBin)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            build/package-lock.json
            extensions/ide-agent/package-lock.json

      # Cache node_modules khóa theo hash của TOÀN BỘ lockfile (root, build/,
      # remote/ và mọi extensions/*/package-lock.json): lockfile đổi ở bất kỳ
      # đâu là khóa cache đổi theo. Chỉ khi cache khớp CHÍNH XÁC (cache-hit
      # == 'true') mới bỏ qua 3 bước cài đặt bên dưới; khớp một phần qua
      # restore-keys thì các bước cài vẫn chạy bình thường (npm ci xóa sạch
      # rồi cài lại theo lockfile) nên cache không bao giờ làm sai
      # dependencies — tệ nhất là không tiết kiệm được thời gian.
      # .build/typings chứa electron.d.ts do postinstall tải về, bước biên
      # dịch src cần file này nên phải cache kèm.
      - name: Cache node_modules (theo lockfile)
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            build/node_modules
            build/rspack/node_modules
            build/vite/node_modules
            remote/node_modules
            remote/web/node_modules
            extensions/node_modules
            extensions/*/node_modules
            extensions/css-language-features/server/node_modules
            extensions/html-language-features/server/node_modules
            extensions/json-language-features/server/node_modules
            .build/typings
          key: ide-code-nm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'build/package-lock.json', 'remote/package-lock.json', 'extensions/*/package-lock.json', 'extensions/package-lock.json', 'extensions/css-language-features/server/package-lock.json', 'extensions/html-language-features/server/package-lock.json', 'extensions/json-language-features/server/package-lock.json', 'remote/web/package-lock.json', 'build/rspack/package-lock.json', 'build/vite/package-lock.json', '.nvmrc', '.npmrc') }}
          restore-keys: |
            ide-code-nm-${{ runner.os }}-

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build/ dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        working-directory: build
        shell: bash
        run: |
          set -e
          for i in 1 2 3 4 5; do npm ci --ignore-scripts && break || {
            [ "$i" -eq 5 ] && { echo "npm ci (build) failed 5 times" >&2; exit 1; }
            echo "npm ci (build) failed, retry $i/5"; sleep 10;
          }; done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install root dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          # --ignore-scripts: skip native module builds (native-keymap fails
          # against Node 24 headers); rebuilt for Electron during packaging.
          # NOTE: this also skips the root postinstall — it is re-run
          # explicitly in the next step.
          for i in 1 2 3 4 5; do npm ci --ignore-scripts && break || {
            [ "$i" -eq 5 ] && { echo "npm ci (root) failed 5 times" >&2; exit 1; }
            echo "npm ci (root) failed, retry $i/5"; sleep 10;
          }; done
        env:
          npm_config_arch: x64
          VSCODE_ARCH: x64
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install workspace dependencies (postinstall)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          # The script-free root install above also skipped the root
          # postinstall (build/npm/postinstall.ts), which is what installs
          # node_modules into build/, remote/ and every extensions/* dir
          # listed in build/npm/dirs.ts, and downloads
          # .build/typings/electron.d.ts (needed by the src compile).
          # Without it the packaging typecheck (tsgo) fails with TS2688:
          # built-in extension tsconfigs pin
          # "typeRoots": ["./node_modules/@types"] (extension-local), so
          # the root @types/node cannot satisfy their "types": ["node"].
          # Re-run postinstall manually. npm_command is the env var
          # postinstall reads to pick its sub-install command (it is the
          # var npm itself sets during a normal install), so every
          # sub-install stays deterministic (ci) and script-free,
          # matching the root install policy.
          for i in 1 2 3; do node build/npm/postinstall.ts && break || {
            [ "$i" -eq 3 ] && { echo "postinstall failed 3 times" >&2; exit 1; }
            echo "postinstall failed, retry $i/3"; sleep 10;
          }; done
        env:
          npm_command: 'ci --ignore-scripts'
          VSCODE_FORCE_INSTALL: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild native modules for Electron
        shell: bash
        run: |
          set -e
          # Root/workspaces were installed with --ignore-scripts (native-keymap
          # fails against Node 24 headers), which also skipped the root
          # preinstall (it provisions the pinned node-gyp + Electron headers)
          # and every native module's own build. These packages ship NO
          # prebuilds -- their bindings must be compiled for Electron, otherwise
          # the packaged app cannot boot: vscode-win32-x64-ci executes
          # IDE Code.exe to generate the V8 compile cache and the main process
          # hard-fails when a required binding is missing (policy-watcher broke
          # build #10; windows-registry / sqlite3 have the same latent pattern).
          # Re-run the root preinstall manually to get build/npm/gyp node-gyp
          # (node-gyp ^11.2.0, pinned by the repo) and the Electron headers.
          # NOTE: do NOT set npm_command here -- preinstall must run plain
          # `npm ci` inside build/npm/gyp.
          node build/npm/preinstall.ts
          NODE_GYP="$PWD/build/npm/gyp/node_modules/.bin/node-gyp.cmd"
          # tr -d '\r': .npmrc may be checked out with CRLF on Windows
          # (.gitattributes has no eol rule for it); a trailing \r would
          # make the sed $ anchor miss and leave TARGET empty.
          TARGET="$(tr -d '\r' < .npmrc | sed -n 's/^target="\(.*\)"$/\1/p')"
          [ -n "$TARGET" ] || { echo "failed to read Electron target from .npmrc" >&2; exit 1; }
          # Scoped @vscode packages (9 scoped + 4 unscoped below = 13 native
          # packages in total ship no prebuilds and only get bindings from
          # their install scripts -- forward audit R4).
          for pkg in policy-watcher spdlog sqlite3 windows-mutex windows-registry windows-process-tree deviceid native-watchdog windows-ca-certs; do
            ( cd "node_modules/@vscode/$pkg" && "$NODE_GYP" rebuild --target="$TARGET" --arch="$VSCODE_ARCH" --dist-url=https://electronjs.org/headers )
          done
          # Unscoped packages. native-keymap goes LAST on purpose: it is the
          # package --ignore-scripts was introduced for; building it against
          # the Electron headers pinned in .npmrc (not plain Node headers) is
          # unverified -- if it fails, the step fails fast here and only this
          # entry needs to be dropped, the bindings above are already built.
          for pkg in native-is-elevated kerberos windows-foreground-love native-keymap; do
            ( cd "node_modules/$pkg" && "$NODE_GYP" rebuild --target="$TARGET" --arch="$VSCODE_ARCH" --dist-url=https://electronjs.org/headers )
          done
          # Fail fast with a clear message if any binding is missing, instead of
          # a cryptic crash 45 minutes later in generateNodeCompileCache.
          # NOTE: @vscode/fs-copyfile is deliberately NOT asserted here: its
          # binding.gyp sets "type": "none" for every OS except macOS (the
          # native CoW clone is APFS-only; win32/linux fall back to node's
          # fs.copyFile in lib/native.js), so no .node is ever produced on
          # Windows. Asserting it failed build #11.
          for f in \
            node_modules/@vscode/policy-watcher/build/Release/vscode-policy-watcher.node \
            node_modules/@vscode/spdlog/build/Release/spdlog.node \
            node_modules/@vscode/sqlite3/build/Release/vscode-sqlite3.node \
            node_modules/@vscode/windows-mutex/build/Release/CreateMutex.node \
            node_modules/@vscode/windows-registry/build/Release/winregistry.node \
            node_modules/@vscode/windows-process-tree/build/Release/windows_process_tree.node \
            node_modules/@vscode/deviceid/build/Release/windows.node \
            node_modules/@vscode/native-watchdog/build/Release/watchdog.node \
            node_modules/@vscode/windows-ca-certs/build/Release/crypt32.node \
            node_modules/native-is-elevated/build/Release/iselevated.node \
            node_modules/kerberos/build/Release/kerberos.node \
            node_modules/windows-foreground-love/build/Release/foreground_love.node \
            node_modules/native-keymap/build/Release/keymapping.node ; do
            [ -f "$f" ] || { echo "missing native binding: $f" >&2; exit 1; }
          done
        env:
          VSCODE_FORCE_INSTALL: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run copilot extension postinstall
        shell: bash
        run: |
          set -e
          # extensions/copilot is the only built-in extension with an
          # install script: a pure-TS asset step (compresses tiktoken
          # tables, resolves/copies the @github/copilot SDK platform
          # files into place) that the script-free installs above skip.
          # Run it explicitly; it performs no native compilation.
          npm --prefix extensions/copilot run postinstall

      - name: Compile ide-agent extension
        shell: bash
        run: |
          set -e
          npm --prefix extensions/ide-agent ci
          npm --prefix extensions/ide-agent run compile
          test -f extensions/ide-agent/out/extension.js

      - name: Compile auxiliary ide-* extensions
        shell: bash
        run: |
          set -e
          # Same as the Linux job: these built-in extensions have
          # main: ./out/extension.js, out/ is gitignored, and nothing else
          # compiles them -- they must be built here or packaging ships
          # them without an entry point. Lockfiles: only ide-deeplink has
          # a package-lock.json; ide-checkout and
          # ide-worktree-textmate have none, so npm install for all three.
          for ext in ide-checkout ide-deeplink ide-worktree-textmate; do
            npm --prefix "extensions/$ext" install --ignore-scripts --no-audit --no-fund
            npm --prefix "extensions/$ext" run compile
            test -f "extensions/$ext/out/extension.js"
          done



      - name: Add Windows SDK to PATH (for signtool)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # patchWin32DependenciesTask (build/gulpfile.vscode.ts) spawns
          # signtool.exe from PATH to detect existing Authenticode
          # signatures before rcedit patches version resources; with
          # signtool missing it silently treats signed files (e.g. the
          # Explorer command DLL) as unsigned, and rcedit then breaks
          # their signatures without any warning. Upstream prepends the
          # SDK bin dir for the client build for exactly this reason
          # (product-build-win32-compile.yml: "for
          # patchWin32DependenciesTask signtool usage"). Locate the
          # newest SDK bin dir that contains signtool.exe and publish
          # it via GITHUB_PATH so the Package step inherits it.
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName "x64" } |
            Where-Object { Test-Path (Join-Path $_ "signtool.exe") } |
            Select-Object -First 1
          if (-not $sdk) { throw "signtool.exe not found in Windows SDK" }
          Add-Content -Path $env:GITHUB_PATH -Value $sdk

      - name: Stage engine (subset + bun 1.4.2)
        shell: bash
        run: |
          set -e
          bash build/engine/stage-engine.sh --src .build/engine-src --out .build/engine-staged --platform win32-x64 --engine-ref ${{ env.ENGINE_REF }}

      - name: Package Electron app (VSCode-win32-x64)
        shell: bash
        run: |
          set -e
          npm run gulp vscode-win32-x64
          # gulp packages to <repo>/../VSCode-win32-x64 (upstream layout:
          # build/gulpfile.vscode.ts packageTask), not .build/win32-x64.
          test -f ../VSCode-win32-x64/IDE\ Code.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build inno updater tools
        shell: bash
        run: |
          set -e
          # code.iss requires tools\* (inno_updater.exe + vcruntime140.dll)
          # with no skipifsourcedoesntexist flag; the folder is produced only
          # by this gulp task, which upstream runs right after the client
          # build (product-build-win32-compile.yml:95) but this workflow
          # never called -- ISCC would fail with "source does not exist".
          npm run gulp vscode-win32-x64-inno-updater
          test -f ../VSCode-win32-x64/tools/inno_updater.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows installer
        shell: bash
        run: |
          set -e
          # NB: the gulp task is vscode-win32-x64-<target>-setup
          # (vscode-win32-x64-inno-updates does not exist).
          npm run gulp vscode-win32-x64-system-setup
          ls -la .build/win32-x64/system-setup/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify engine payload in packaged tree
        shell: bash
        run: |
          set -e
          # The Inno installer recursively packages ../VSCode-win32-x64
          # (build/win32/code.iss, Source: "*"), and this workflow has no
          # Inno extractor, so verifying that packaged tree verifies the
          # installer payload. The script expects the app root: the
          # directory that contains resources/app/engine/. Any failed
          # assert fails the job.
          bash build/engine/verify-engine-payload.sh ../VSCode-win32-x64

      - name: Resolve package version
        id: ver
        shell: bash
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          [ -n "$VERSION" ] || { echo "failed to read version from package.json" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename installer with version
        shell: bash
        run: |
          set -e
          VERSION="$(node -p "require('./package.json').version")"
          mv .build/win32-x64/system-setup/VSCodeSetup.exe ".build/win32-x64/system-setup/IDE-Code-Setup-x64-${VERSION}.exe"
          ls -la .build/win32-x64/system-setup/*.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ide-code-windows-x64-v${{ steps.ver.outputs.version }}
          path: .build/win32-x64/system-setup/*Setup*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
